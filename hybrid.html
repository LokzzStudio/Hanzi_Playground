<style>
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#5fb6f4 50%,#63b146 50%)}
  #stage{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:visible}   /* scenery may spill past the 16:9 box on tall screens */
  #gl{position:fixed;left:0;top:0;width:100vw;height:100vh;touch-action:none}
  #back{position:fixed;left:14px;top:12px;z-index:3;font:13px system-ui,sans-serif;color:#1d3b53;text-decoration:none;opacity:.85}
  #back:hover{opacity:1;text-decoration:underline}
  #msg{position:fixed;inset:0;z-index:2;display:grid;place-items:center;padding:24px;text-align:center;font:16px/1.7 system-ui,sans-serif;color:#22303a;background:#bfe4fb}
  #msg[hidden]{display:none}
  #msg a{color:inherit;font-weight:600}
  #msg small{opacity:.7;font-size:13px}
  .cloud{animation:drift linear infinite}
  @keyframes drift{from{transform:translateX(-340px)}to{transform:translateX(1940px)}}
  @media (prefers-reduced-motion:reduce){.cloud{animation:none}}
</style>

<script>
// shown if anything below fails before the first frame
window.fail=why=>{if(window.__ok)return;const m=document.getElementById('msg');
  m.innerHTML='<div>This version could not start on this device.<br><small></small><br><a href="2d.html">Open the 2D version</a></div>';m.querySelector('small').textContent=why||'';m.hidden=false};
addEventListener('error',e=>fail(e.message));
addEventListener('unhandledrejection',e=>fail(String(e.reason&&e.reason.message||e.reason)));
setTimeout(()=>fail('It is taking too long to load. Check the connection and reload.'),30000);
</script>
<script type="module" onerror="fail('The 3D engine could not be downloaded.')">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const $=id=>document.getElementById(id), R=Math.random, rnd=(a,b)=>a+R()*(b-a), pick=a=>a[R()*a.length|0], TAU=Math.PI*2;
const V3=(x,y,z)=>new THREE.Vector3(x,y,z), F32=(a,n)=>new THREE.Float32BufferAttribute(a,n);

/* ---------- backdrop scenery that needs a little code ---------- */
{const hill=$("ridge"),len=hill.getTotalLength(),tr=[];   // tiny round trees along the far ridge
 for(let l=0;l<len;l+=rnd(34,70)){const p=hill.getPointAtLength(l);if(p.y<560&&p.y>380&&p.x>-60&&p.x<1660){const r=rnd(10,22);tr.push(`<circle cx="${p.x.toFixed(0)}" cy="${(p.y-r*.2).toFixed(0)}" r="${r.toFixed(0)}"/>`)}}
 $('farTrees').innerHTML=tr.join('')}
const treeSvg=(x,s,fruit)=>`<g transform="translate(${x} 590) scale(${s})"><ellipse cx="52" cy="-2" rx="100" ry="12" fill="#1f4a1a" opacity=".16" filter="url(#bl)"/>
  <path d="M-13,0 Q-8,-60 -9,-112 H11 Q9,-60 15,0Z" fill="url(#trunk)"/>
  <g fill="url(#bushD)"><circle cx="-32" cy="-104" r="48"/><circle cx="34" cy="-106" r="50"/><circle cy="-152" r="58"/><circle cx="0" cy="-104" r="52"/></g>
  <g fill="url(#bushL)"><circle cx="-38" cy="-112" r="40"/><circle cx="28" cy="-116" r="42"/><circle cx="-6" cy="-160" r="48"/></g>
  <ellipse cx="-30" cy="-176" rx="22" ry="13" fill="#fff" opacity=".22" transform="rotate(-24 -30 -176)"/>
  ${fruit?[[-44,-96],[20,-132],[40,-90],[-8,-170],[-20,-128]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="5.5" fill="#e8483c"/><circle cx="${a-1.6}" cy="${b-1.8}" r="1.8" fill="#ffb3a8"/>`).join(''):''}</g>`;
$('trees').innerHTML=[[40,1.1,1],[210,.8,0],[690,.9,0],[1030,1.05,1],[1210,.75,0],[1560,1.15,0],[430,.62,0],[1400,.66,1]].map(a=>treeSvg(...a)).join('');
{let d='',d2='',f='',st='';const onSand=(x,y)=>((x-1230)/206)**2+((y-800)/66)**2<1;
 for(let i=0;i<130;i++){const x=rnd(10,1590)|0,y=rnd(612,894)|0;if(onSand(x,y))continue;
   if(i<70)d+=`M${x},${y} q-4,-8 -7,-11 M${x},${y} v-14 M${x},${y} q4,-8 7,-11 `;
   else if(i<95)d2+=`M${x},${y} q-3,-6 -5,-8 M${x},${y} v-10 M${x},${y} q3,-6 5,-8 `;
   else if(i<118)f+=`<path d="M${x},${y+8} v-8" stroke="#4f9f37" stroke-width="1.6"/><use href="#daisy" x="${x}" y="${y}" fill="${pick(['#fff','#ffd1e3','#fff','#e4d6ff'])}" transform="scale(1)"/><circle cx="${x}" cy="${y}" r="2.2" fill="#f5a623"/>`;
   else f+=`<circle cx="${x}" cy="${y}" r="3.6" fill="${pick(['#ffe98a','#ff9fb8','#ffd24d'])}"/><circle cx="${x-1}" cy="${y-1}" r="1.2" fill="#fff" opacity=".7"/>`}
 $('deco').innerHTML=`<path d="${d}" fill="none" stroke="#3f8a2f" stroke-width="2.8" stroke-linecap="round"/><path d="${d2}" fill="none" stroke="#a5e062" stroke-width="2.4" stroke-linecap="round"/>${f}`;
 // stepping stones along the path
 [[880,664],[916,704],[958,742],[1004,776],[1046,806]].forEach(([x,y],i)=>st+=`<ellipse cx="${x+3}" cy="${y+3}" rx="19" ry="7" fill="#7d6a3c" opacity=".4"/><ellipse cx="${x}" cy="${y}" rx="19" ry="7" fill="#d8d2c2"/><ellipse cx="${x-3}" cy="${y-1.5}" rx="12" ry="4" fill="#f4f0e4"/>`);
 $('stones').innerHTML=st}
// bushes along the fence, in front of it
$('stones').insertAdjacentHTML('beforebegin',[[120,1],[330,.8],[570,1.1],[1090,.9],[1330,1],[1500,1.2]].map(([x,s])=>`<g transform="translate(${x} 612) scale(${s})"><ellipse cx="30" cy="2" rx="62" ry="9" fill="#1f4a1a" opacity=".2" filter="url(#bl2)"/><g fill="url(#bushD)"><circle cx="-22" cy="-16" r="24"/><circle cx="20" cy="-18" r="26"/><circle cy="-30" r="28"/></g><g fill="url(#bushL)"><circle cx="-26" cy="-20" r="19"/><circle cx="14" cy="-24" r="20"/><circle cx="-4" cy="-36" r="21"/></g></g>`).join(''));

/* ---------- renderer: one transparent canvas laid exactly over the SVG ---------- */
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0,0);
renderer.toneMapping=THREE.NeutralToneMapping;renderer.toneMappingExposure=1;
const scene=new THREE.Scene(),cam=new THREE.OrthographicCamera(0,1600,0,-900,1,3000);cam.position.z=1000;   // 1 world unit = 1 SVG px, y up (world y = -svg y)
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.environmentIntensity=.35;
const sun=new THREE.DirectionalLight(0xfff0da,2.1);sun.position.set(-600,800,900);   // upper left, like the painted sun
scene.add(sun,new THREE.HemisphereLight(0xe2f1ff,0xa8c97a,1.15));

/* ---------- clay materials and geometry helpers (from 3d.html; heroes are drawn in SVG-pixel units, origin at the feet) ---------- */
const cv=(s,draw)=>{const c=document.createElement('canvas');c.width=c.height=s;draw(c.getContext('2d'),s);return c};
const clayBump=new THREE.CanvasTexture(cv(128,(g,s)=>{g.fillStyle='#808080';g.fillRect(0,0,s,s);g.filter='blur(1px)';for(let i=0;i<900;i++){g.globalAlpha=R()*.22;g.fillStyle=R()<.5?'#fff':'#000';g.beginPath();g.arc(R()*s,R()*s,R()*4+.4,0,TAU);g.fill()}}));
clayBump.wrapS=clayBump.wrapT=THREE.RepeatWrapping;clayBump.repeat.set(2,2);
const blobTex=new THREE.CanvasTexture(cv(128,(g,s)=>{const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'rgba(28,58,18,1)');gr.addColorStop(.5,'rgba(28,58,18,.5)');gr.addColorStop(1,'rgba(28,58,18,0)');g.fillStyle=gr;g.fillRect(0,0,s,s)}));blobTex.colorSpace=THREE.SRGBColorSpace;
// every material is transparent so heroes and flat equipment share one list and sort purely by group renderOrder
const clay=(color,o)=>new THREE.MeshStandardMaterial({color,roughness:.7,bumpMap:clayBump,bumpScale:.6,transparent:true,...o});
const SPH=new THREE.SphereGeometry(1,32,22);
const sph=(mat,r,x,y,z,sx=1,sy=1,sz=1)=>{const m=new THREE.Mesh(SPH,mat);m.scale.set(r*sx,r*sy,r*sz);m.position.set(x,y,z);return m};
const cap=(mat,r,len,x,y,z)=>{const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,8,20),mat);m.position.set(x,y,z);return m};
const lathe=(mat,prof,sz=1)=>{const m=new THREE.Mesh(new THREE.LatheGeometry(prof.map(p=>new THREE.Vector2(p[0],p[1])),40),mat);m.scale.z=sz;return m};
// limb: a round shape swept through points, with a radius per point and rounded ends
function limb(mat,pts,rad,seg){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>V3(p[0],p[1],p[2]||0))),N=seg||Math.max(16,pts.length*10),K=14;
  const Rr=Array.isArray(rad)?rad:pts.map(()=>rad),fr=curve.computeFrenetFrames(N,false),len=curve.getLength(),P=[],I=[],UV=[];

  if(s.kind==='swing'){const a=s.ang*Math.PI/180;h.px=SW.px[s.i]+SW.L*Math.sin(a);h.py=SW.py+SW.L*Math.cos(a);h.rot=-s.ang}
  else if(s.kind==='saw'){const a=saw.ang*Math.PI/180,lx=s.side*132,ly=-7;
    h.px=640+lx*Math.cos(a)-ly*Math.sin(a);h.py=728+lx*Math.sin(a)+ly*Math.cos(a);h.rot=saw.ang;h.dir=-s.side}
  else if(s.kind==='bench'){h.px=s.x;h.py=588}
  else{const e=3.1-h.t;h.dir=-1;
    if(e<1.4){const u=e/1.4;h.sit=false;h.moving=true;h.ph+=.2;h.px=1478-74*u;h.py=668-200*u}      // climb the ladder
    else{const u=Math.min(1,Math.max(0,(e-1.9)/1.2))**1.7,v=1-u,P=SLIDE,                            // then ride the chute
      B=k=>v*v*v*P[0][k]+3*v*v*u*P[1][k]+3*v*u*u*P[2][k]+u*u*u*P[3][k],
      D=k=>3*v*v*(P[1][k]-P[0][k])+6*v*u*(P[2][k]-P[1][k])+3*u*u*(P[3][k]-P[2][k]);
      h.px=B(0);h.py=B(1);h.rot=(Math.atan2(D(1),D(0))*180/Math.PI-180)*.5}}   // lean with the slope, but stay mostly upright
  if(h.t<=0){s.on=false;s.who=null;h.slot=null;h.x=s.kind==='slide'?1090:s.ax;h.y=s.kind==='slide'?668:s.ay;h.hopT=.35;go(h,'idle',rnd(.4,1.5))}}

function equip(dt){
  slots.forEach(s=>{if(s.kind!=='swing')return;
    const want=s.on&&s.who.t>1.6?24:0;s.amp+=(want-s.amp)*Math.min(1,dt*(want?.9:1.3));s.tau+=dt;
    s.ang=s.amp*Math.sin(s.tau*2.3+s.i*1.3);
    swing[s.i].grp.rotation.z=s.ang*Math.PI/180});          // pendulum about the top bar (counter-clockwise for +ang, as 2d.html's rotate(-ang))
  const [a,b]=slots.filter(s=>s.kind==='saw'),both=a.on&&b.on;
  if(both)saw.tau+=dt;else if(a.on||b.on)saw.rest=a.on?-12:12;
  saw.ang+=((both?12*Math.sin(saw.tau*2.6):saw.rest)-saw.ang)*Math.min(1,dt*5);
  plank.grp.rotation.z=-saw.ang*Math.PI/180}

function update(h,dt){
  h.t-=dt;h.sit=h.moving=false;h.rot=0;h.px=h.py=null;
  switch(h.st){
    case 'idle': if(h.t<=0)think(h);break;
    case 'sit': h.sit=true;if(h.t<=0)go(h,'idle',.5);break;
    case 'walk': h.moving=true;
      if(step(h,dt)){const f=h.then;h.then=null;f?f():go(h,'idle',1)}
      else if(h.t<=0){release(h);go(h,'idle',1)}
      break;
    case 'chase':{const o=h.other;if(h.wait>0){h.wait-=dt;break}
      h.moving=true;h.tx=o.x;h.ty=o.y;step(h,dt);
      if(Math.hypot(o.x-h.x,o.y-h.y)<48*sc(h.y)){h.hopT=o.hopT=.45;                // tag!
        if(h.round<1&&R()<.75)chase(o,h,h.round+1);else{go(h,'idle',rnd(.6,1.6));go(o,'idle',rnd(.6,1.6))}}
      else if(h.t<=0){go(h,'idle',1);go(o,'idle',1)}
      break}
    case 'flee': h.moving=true;h.rt-=dt;if(h.rt<=0||step(h,dt))fleePoint(h,h.other);break;
    case 'use': useSlot(h,h.slot);break}}

// pose: place the root at the screen position, scale by perspective, turn toward the travel direction, then bob, sway, blink
function draw(h,T,dt){
  if(h.hopT>0)h.hopT-=dt;
  const using=h.st==='use',gy=using?h.slot.base:h.y,s=h.k*sc(gy),x=h.px??h.x,y=h.py??h.y,p=h.ph;
  h.key=gy;
  h.root.position.set(x,-y,0);h.tilt.rotation.z=-h.rot*Math.PI/180;h.turn.scale.setScalar(s);
  const K=using?h.slot.kind:'';
  const yt=using?(K==='swing'?0:K==='bench'?h.dir*.3:h.dir*1.15):h.moving?h.dir*(.5+.5*Math.abs(h.vx)):0;   // three-quarter view while travelling, face the viewer at rest
  let d=yt-h.yaw;h.yaw+=d*Math.min(1,dt*(using?14:8));h.turn.rotation.y=h.yaw;
  let by=h.sit?-h.drop:0,rx=0,rz=0;
  if(h.hopT>0)by+=Math.sin(Math.PI*(1-h.hopT/.45))*26;
  if(h.moving){if(h.hopper){by+=Math.abs(Math.sin(p))*14;rx=Math.sin(p*2)*.06}else{by+=Math.abs(Math.sin(p))*3;rz=Math.sin(p)*h.wad}}
  if(h.floater)by+=Math.sin(T*2.4+h.i)*4;
  const br=1+Math.sin(T*2+h.i)*.012;
  h.b.position.y=by;h.b.rotation.set(rx,0,rz);h.b.scale.set(2-br,br,2-br);
  h.legs.forEach((l,j)=>{const t=h.sit?-(h.ang[j]??h.ang)*Math.PI/180:h.moving?Math.sin(p+j*Math.PI)*.7:0;l.rotation.x+=(t-l.rotation.x)*Math.min(1,dt*14)});
  if(h.sway){h.sway.rotation.z=Math.sin(T*2.6+h.i)*(h.moving?.16:.06);h.sway.rotation.x=Math.cos(T*2.1+h.i)*(h.moving?.1:.03)}
  h.bt-=dt;if(h.bt<-.13)h.bt=rnd(1.5,5);h.eyes.forEach(e=>e.scale.y=h.bt<0?.12:1);
  h.shA+=((using?0:1)-h.shA)*Math.min(1,dt*10);                       // blob shadow fades out on equipment
  const w=h.sh*2.7*s;h.shadow.scale.set(w,w*.3,1);h.shadow.position.set(x+w*.07,-gy-1,-500);h.shadow.material.opacity=.42*h.shA;h.shadow.visible=h.shA>.01}

let order='';
function sortDepth(){
  const a=[...sprites].sort((p,q)=>p.key-q.key),sig=a.map(s=>s.grp.id).join();
  if(sig!==order){order=sig;a.forEach((s,n)=>s.grp.traverse(o=>{if(o.isGroup)o.renderOrder=n+1}))}}   // nested Groups need the rank too

// ?lineup shows the cast standing in a row (for comparing against the reference art)
if(location.search.includes('lineup'))heroes.forEach((h,i)=>{h.x=150+i*186;h.y=830;h.dir=1;go(h,'pose',1e9)});

/* ---------- fit, input, loop ---------- */
// same rule as the SVG: slice (anchored bottom-centre) on 16:9 and wider windows, otherwise meet
function fit(){
  const W=innerWidth,H=innerHeight,slice=W/H>=16/9,s=slice?W/1600:Math.min(W/1600,H/900),vw=W/s,vh=H/s,cx=800,cy=slice?900-vh/2:450;
  cam.left=cx-vw/2;cam.right=cx+vw/2;cam.top=-(cy-vh/2);cam.bottom=-(cy+vh/2);cam.updateProjectionMatrix();
  renderer.setSize(W,H,false);$('stage').setAttribute('preserveAspectRatio',slice?'xMidYMax slice':'xMidYMid meet')}
fit();addEventListener('resize',fit);
{const ray=new THREE.Raycaster(),m=new THREE.Vector2();
 $('gl').addEventListener('pointerdown',e=>{m.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(m,cam);
   const hit=ray.intersectObjects(heroes.map(h=>h.root),true)[0];if(hit&&hit.object.userData.hero.hopT<=0)hit.object.userData.hero.hopT=.45})}
Object.assign(window,{heroes,slots,goSlot,go,sprites});   // handy in the console

await Promise.all(pieces);
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(.05,clock.getDelta()),T=clock.elapsedTime;
  equip(dt);heroes.forEach(h=>update(h,dt));
  heroes.forEach(h=>draw(h,T,dt));sortDepth();
  cur=null;renderer.render(scene,cam);
  if(!window.__ok){window.__ok=true;$('msg').hidden=true}});   // first frame is on screen
</script>
</body>
